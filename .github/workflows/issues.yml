# Ein Workflow für alles, was an Issues hängt: Labels pflegen, issues.json bauen, Pages deployen.
# Jeder Lauf liest alle Issues, repariert Labels nachholend (auch nach Ausfällen) und deployt den Gesamtstand;
# welches Ereignis ihn ausgelöst hat, spielt keine Rolle.
# Ereignisse, die eine Action mit dem Standard-Token auslöst, starten keinen weiteren Lauf (kein Kreislauf).
# Voraussetzung: Settings → Pages → Source: "GitHub Actions".
name: Issues und Karte

on:
  issues:
    types: [opened, edited, deleted, closed, reopened, labeled, unlabeled, transferred]
  push:
    branches: [main]
    paths: [karte/**, .github/workflows/issues.yml]
  # Sub-Issue-Verknüpfungen lösen kein Ereignis aus; dafür der Stundenlauf (oder "Run workflow" von Hand).
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pages: write
  id-token: write

# Global in Reihe, nie abbrechen: ein wartender Lauf wird nur durch einen neueren ersetzt, der denselben Gesamtstand liest.
concurrency:
  group: issues-und-karte
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Labels pflegen und issues.json erzeugen
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;

            // Dropdown-Text (exakt wie in .github/ISSUE_TEMPLATE/mangel.yml) -> Label
            const ART = {
              'Beschilderung falsch oder fehlend':   'art: schild',
              'Verkehrsregelung / Verkehrsführung':  'art: regelung',
              'Belag / Oberfläche':                  'art: belag',
              'Fehlende Infrastruktur':              'art: fehlende-infrastruktur',
              'Hindernis / Engstelle':               'art: hindernis',
              'Gefährliche Stelle':                  'art: gefahr',
              'Vorschlag / Idee (kein akuter Mangel)': 'art: vorschlag',
              'Sonstiges':                           'art: sonstiges',
            };
            const SCHWERE = {
              'niedrig (ärgerlich)':  'schwere: niedrig',
              'mittel (behindert)':   'schwere: mittel',
              'hoch (gefährlich)':    'schwere: hoch',
            };
            const EXKLUSIV = ['status:', 'schwere:']; // 'art:' darf mehrfach vorkommen
            const feld = (body, label) => {
              const m = body.match(new RegExp('### ' + label + '\\s*\\n+([\\s\\S]*?)(?=\\n### |$)'));
              return m ? m[1].trim() : '';
            };

            const roh = (await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'all', per_page: 100 }))
              .filter(i => !i.pull_request);

            // ---- Labels pflegen, nachholend über alle Issues
            for (const i of roh) {
              let labels = i.labels.map(l => l.name);
              const body = i.body || '';

              // Fehlende Gruppe aus dem Formular ergänzen
              const hinzu = [];
              for (const g of [{ prefix: 'art:', neu: ART[feld(body, 'Art des Mangels')] }, { prefix: 'schwere:', neu: SCHWERE[feld(body, 'Schwere')] }]) {
                if (g.neu && !labels.some(n => n.startsWith(g.prefix))) hinzu.push(g.neu);
              }
              if (hinzu.length) {
                await github.rest.issues.addLabels({ owner, repo, issue_number: i.number, labels: hinzu });
                labels = labels.concat(hinzu);
                core.info(`#${i.number}: gesetzt ${hinzu.join(', ')}`);
              }

              // Exklusive Gruppen: bei Doppelung gewinnt das zuletzt gesetzte Label (laut Issue-Historie)
              for (const prefix of EXKLUSIV) {
                const mehrere = labels.filter(n => n.startsWith(prefix));
                if (mehrere.length < 2) continue;
                const events = await github.paginate(github.rest.issues.listEvents, { owner, repo, issue_number: i.number, per_page: 100 });
                const zuletzt = events.filter(e => e.event === 'labeled' && e.label && mehrere.includes(e.label.name)).pop();
                const behalten = zuletzt ? zuletzt.label.name : mehrere[mehrere.length - 1];
                for (const name of mehrere.filter(n => n !== behalten)) {
                  await github.rest.issues.removeLabel({ owner, repo, issue_number: i.number, name });
                  labels = labels.filter(n => n !== name);
                  core.info(`#${i.number}: entfernt "${name}" (behalten "${behalten}")`);
                }
              }
              i._labels = labels;
            }

            // ---- issues.json aus demselben Datenstand (inklusive der eben gesetzten Labels)
            const issues = roh.map(i => ({
              number: i.number, title: i.title, state: i.state, url: i.html_url,
              labels: i._labels, body: i.body || '',
              updated: i.updated_at, kinder: [], eltern: null,
              _sub: (i.sub_issues_summary && i.sub_issues_summary.total) || 0,
            }));
            const byNr = Object.fromEntries(issues.map(i => [i.number, i]));
            for (const p of issues.filter(i => i._sub > 0)) {
              const subs = await github.paginate('GET /repos/{owner}/{repo}/issues/{issue_number}/sub_issues', { owner, repo, issue_number: p.number, per_page: 100 });
              for (const s of subs) if (byNr[s.number]) { p.kinder.push(s.number); byNr[s.number].eltern = p.number; }
            }
            issues.forEach(i => delete i._sub);
            // Label-Farben: aus den Issues plus Repo-Labels (damit auch gerade erst gesetzte Labels eine Farbe haben)
            const labelFarben = {};
            (await github.paginate(github.rest.issues.listLabelsForRepo, { owner, repo, per_page: 100 })).forEach(l => { labelFarben[l.name] = l.color; });
            const fs = require('fs');
            fs.writeFileSync('karte/issues.json', JSON.stringify({ stand: new Date().toISOString(), labelFarben, issues }));
            core.info(`${issues.length} Issues geschrieben`);

      - uses: actions/upload-pages-artifact@v5
        with:
          path: karte

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
