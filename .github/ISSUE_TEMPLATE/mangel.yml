name: Mangel melden
description: Einen Mangel an Rad-, Fuß- oder Verkehrsinfrastruktur in Merzig melden.
title: "[Ort]: Kurze Beschreibung"
labels:
  - "status: unbestätigt"
body:
  - type: markdown
    attributes:
      value: |
        Danke fürs Melden!
        Am einfachsten geht es über die [Karte](https://pasbi.github.io/merzig-mobilitaetsmaengel/): Ort anklicken, dann wird dieses Formular mit Koordinaten vorausgefüllt.

  - type: dropdown
    id: art
    attributes:
      label: Art des Mangels
      options:
        - Beschilderung falsch oder fehlend
        - Verkehrsregelung / Verkehrsführung
        - Belag / Oberfläche
        - Fehlende Infrastruktur
        - Hindernis / Engstelle
        - Gefährliche Stelle
        - Vorschlag / Idee (kein akuter Mangel)
        - Sonstiges
    validations:
      required: true

  - type: dropdown
    id: schwere
    attributes:
      label: Schwere
      description: Wie stark behindert oder gefährdet der Mangel?
      options:
        - niedrig (ärgerlich)
        - mittel (behindert)
        - hoch (gefährlich)
      default: 1
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Was ist los, wen behindert oder gefährdet es, seit wann? Fotos können per Drag & Drop eingefügt werden.
      placeholder: Der Laternenmast steht mitten auf dem Radweg, Restbreite etwa 60 cm, nachts schlecht sichtbar ...
    validations:
      required: true

  - type: textarea
    id: loesung
    attributes:
      label: Lösungsvorschlag
      description: Optional. Was müsste passieren, damit der Mangel behoben ist? Gern auch Alternativen oder Verweise auf Richtlinien.
      placeholder: Mast an den Rand versetzen; übergangsweise die Engstelle markieren.

  - type: textarea
    id: ort
    attributes:
      label: Standort
      description: Genaue Adresse, Bereich („Fußgängerzone“) oder Liste, bei mehreren Stellen eine Zeile je Standort in der Reihenfolge der Punkte in der Geometrie.
      placeholder: |
        Poststraße 12, vor der Bäckerei
        Marktplatz, Südseite vor dem Brunnen
    validations:
      required: true

  - type: textarea
    id: geometrie
    attributes:
      label: Geometrie
      description: >-
        GeoJSON des Orts (Punkt, Linie oder Fläche), ohne ```-Zeilen drumherum. Wird von der Karte automatisch ausgefüllt.
        Von Hand als FeatureCollection, z. B. ein Punkt (erst Länge, dann Breite):
        {"type":"FeatureCollection","features":[{"type":"Feature","properties":{},"geometry":{"type":"Point","coordinates":[6.6400,49.4450]}}]}
      render: geojson
    validations:
      required: true

  - type: checkboxes
    id: lizenz
    attributes:
      label: Lizenz und Datenschutz
      options:
        - label: Ich stelle Text und Fotos dieser Meldung unter [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/deed.de), damit Presse, Verwaltung und andere sie frei nutzen können.
          required: true
        - label: Auf den Fotos sind keine erkennbaren Personen oder Kennzeichen, und ich habe sie selbst gemacht.
          required: true
